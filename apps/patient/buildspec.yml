version: 0.2

env:
  secrets-manager:
    VITE_ENV_NAME: patient_build_vars:VITE_ENV_NAME
    VITE_RUDDERSTACK_WRITE_KEY: patient_build_vars:VITE_RUDDERSTACK_WRITE_KEY
    VITE_RUDDERSTACK_DATA_PLANE_URL: patient_build_vars:VITE_RUDDERSTACK_DATA_PLANE_URL
    VITE_MIXPANEL_TOKEN: patient_build_vars:VITE_MIXPANEL_TOKEN
    VITE_GRAPHQL_API_ENDPOINT: patient_build_vars:VITE_GRAPHQL_API_ENDPOINT
    VITE_THIRD_PARTY_REST_API_ENDPOINT: patient_build_vars:VITE_THIRD_PARTY_REST_API_ENDPOINT
    VITE_ALTO_PHARMACY_ID: patient_build_vars:VITE_ALTO_PHARMACY_ID
    VITE_AMAZON_PHARMACY_ID: patient_build_vars:VITE_AMAZON_PHARMACY_ID
    VITE_COST_PLUS_PHARMACY_ID: patient_build_vars:VITE_COST_PLUS_PHARMACY_ID
    VITE_COSTCO_PHARMACY_ID: patient_build_vars:VITE_COSTCO_PHARMACY_ID
    VITE_NOVOCARE_PHARMACY_ID: patient_build_vars:VITE_NOVOCARE_PHARMACY_ID
    VITE_WALMART_MAIL_ORDER_PHARMACY_ID: patient_build_vars:VITE_WALMART_MAIL_ORDER_PHARMACY_ID
    VITE_TWILIO_SMS_NUMBER: patient_build_vars:VITE_TWILIO_SMS_NUMBER

phases:
  install:
    on-failure: ABORT
    runtime-versions:
      nodejs: 20
    commands:
      - printenv
      - node -v
      - npm -v
      - npm install
      - npm install @rollup/rollup-linux-x64-gnu
      - npm rebuild
  build:
    commands:
      - export DD_GIT_COMMIT_SHA=$(git rev-parse HEAD)
      - export DD_GIT_REPOSITORY_URL=$(git config --get remote.origin.url)
      - printenv
      - node -v
      - npm -v
      # For boson save in folders named after the branch name
      - |
        if [ "$VITE_ENV_NAME" = "boson" ] ; then
          export OUTPUT_DIR=$(echo $CODEBUILD_WEBHOOK_HEAD_REF | sed -e "s/refs\/heads\///g")

          # Lowercase branch name
          OUTPUT_DIR=$(echo "$OUTPUT_DIR" | tr '[:upper:]' '[:lower:]')

          # Replace /'s
          OUTPUT_DIR=$(echo "$OUTPUT_DIR" | tr / _)

          npx nx run patient:build:boson
        fi
      # For photon and neutron save in folders named after the git hash
      - |
        if [ "$VITE_ENV_NAME" = "photon" ] ; then
          export OUTPUT_DIR="photon"
          npx nx run patient:build:photon
        fi
      - |
        if [ "$VITE_ENV_NAME" = "neutron" ] ; then
          export OUTPUT_DIR="neutron"
          npx nx run patient:build:neutron
        fi
      - echo "OUTPUT_DIR set to '$OUTPUT_DIR'"
  post_build:
    commands:
      - |
        BRANCH_NAME=$(echo $CODEBUILD_WEBHOOK_HEAD_REF | sed -e "s/refs\/heads\///g")
        echo "BRANCH_NAME: $BRANCH_NAME"
        if [ "$CODEBUILD_BUILD_SUCCEEDING" = "1" ] && [ "$VITE_ENV_NAME" = "boson" ] && [ "$BRANCH_NAME" != "neturons/merge" ] && [ "$BRANCH_NAME" != "photons/merge" ]; then
          echo "Requesting Github installation access token..."
          GITHUB_ACCESS_TOKEN=$(bash ./tools/codebuild_github_access_token.sh codebuild_github_token)
          echo "Successfully requested token!"
          echo "Sending e2e test workflow dispatch to GitHub..."
          curl -X POST \
            -H "Authorization: token $GITHUB_ACCESS_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Photon-Health/client/actions/workflows/pr-e2e-tests.yml/dispatches \
            -d "{\"ref\":\"$CODEBUILD_WEBHOOK_HEAD_REF\",\"inputs\":{\"output_dir\":\"$OUTPUT_DIR\",\"sha\":\"$CODEBUILD_RESOLVED_SOURCE_VERSION\",\"app\":\"patient\"}}"
        fi
artifacts:
  files:
    - '**/*'
  base-directory: 'dist/apps/patient'
  name: $OUTPUT_DIR
