name: Playwright e2e Tests
on:
  repository_dispatch:
    types: [codebuild-complete]

permissions:
  contents: read

jobs:
  e2e-tests:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: app
            codegen: 'npx nx run app:codegen'
            base_url: 'http://localhost:3000'
            report_name: playwright-report-clinical
            report_path: apps/app/playwright-report/
          - app: patient
            codegen: 'npx nx run patient:codegen'
            base_url: 'http://localhost:3001'
            report_name: playwright-report-patient
            report_path: apps/patient/playwright-report/
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Codegen
        run: ${{ matrix.codegen }}

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        env:
          PLAYWRIGHT_BASE_URL: ${{ matrix.base_url }}
          PLAYWRIGHT_CLINICAL_BASE_URL: https://app.boson.health
          PLAYWRIGHT_E2E_ACCOUNT_USERNAME: ${{ vars.PLAYWRIGHT_E2E_ACCOUNT_USERNAME }}
          PLAYWRIGHT_E2E_ACCOUNT_PASSWORD: ${{ secrets.PLAYWRIGHT_E2E_ACCOUNT_PASSWORD }}
          PLAYWRIGHT_E2E_SSO_ACCOUNT_USERNAME: ${{ vars.PLAYWRIGHT_E2E_SSO_ACCOUNT_USERNAME }}
          PLAYWRIGHT_E2E_SSO_ACCOUNT_PASSWORD: ${{ secrets.PLAYWRIGHT_E2E_SSO_ACCOUNT_PASSWORD }}
          PLAYWRIGHT_E2E_PATIENT_PHONE: ${{ vars.PLAYWRIGHT_E2E_PATIENT_PHONE }}
        run: npx nx run ${{ matrix.app }}:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: ${{ matrix.report_name }}
          path: ${{ matrix.report_path }}
          retention-days: 30
