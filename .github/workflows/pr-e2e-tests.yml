name: Playwright e2e Tests
on:
  pull_request:
    branches: [ boson ]

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    environment: 'boson'
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Codegen
        run: npx nx run app:codegen

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        env:
          PLAYWRIGHT_BASE_URL: 'http://localhost:3000'
          PLAYWRIGHT_E2E_ACCOUNT_USERNAME: ${{ vars.PLAYWRIGHT_E2E_ACCOUNT_USERNAME }}
          PLAYWRIGHT_E2E_ACCOUNT_PASSWORD: ${{ secrets.PLAYWRIGHT_E2E_ACCOUNT_PASSWORD }}
          PLAYWRIGHT_E2E_SSO_ACCOUNT_USERNAME: ${{ vars.PLAYWRIGHT_E2E_SSO_ACCOUNT_USERNAME }}
          PLAYWRIGHT_E2E_SSO_ACCOUNT_PASSWORD: ${{ secrets.PLAYWRIGHT_E2E_SSO_ACCOUNT_PASSWORD }}
        run: npx nx run app:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/app/playwright-report/
          retention-days: 30
