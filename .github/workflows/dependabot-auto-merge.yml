name: Dependabot Auto Merge

on:
  pull_request:
    branches: [ boson ]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3

      - uses: actions/create-github-app-token@v3
        if: steps.metadata.outputs.dependency-group == 'security'
        id: generate-token
        with:
          # configured at https://github.com/organizations/Photon-Health/settings/secrets/dependabot
          app-id: ${{ secrets.CPR_APP_ID_DEPENDABOT }}
          private-key: ${{ secrets.CPR_APP_SECRET_DEPENDABOT }}

      - name: Approve PR
        if: steps.metadata.outputs.dependency-group == 'security'
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}

      - name: Enable auto-merge
        if: steps.metadata.outputs.dependency-group == 'security'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
