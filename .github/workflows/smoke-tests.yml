name: Playwright Smoke Tests
on:
  repository_dispatch:
    types: [ smoke-test ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to test against'
        type: choice
        options:
          - boson
          - neutron
        default: boson

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    environment: ${{ github.event.client_payload.environment || inputs.environment || 'boson' }}
    env:
      TARGET_ENV: ${{ github.event.client_payload.environment || inputs.environment || 'boson' }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: |
          echo "Running smoke tests against https://app.${TARGET_ENV}.health"
          npx nx run app:e2e:ci
        env:
          PLAYWRIGHT_BASE_URL: https://app.${{ env.TARGET_ENV }}.health
          PLAYWRIGHT_E2E_ACCOUNT_USERNAME: ${{ vars.PLAYWRIGHT_E2E_ACCOUNT_USERNAME }}
          PLAYWRIGHT_E2E_ACCOUNT_PASSWORD: ${{ secrets.PLAYWRIGHT_E2E_ACCOUNT_PASSWORD }}

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/app/playwright-report/
          retention-days: 30
