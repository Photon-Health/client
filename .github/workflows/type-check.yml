name: Check Types

on:
  pull_request:
    branches: [boson, neutron, photon]

permissions:
  contents: read

jobs:
  run-linters:
    name: Run type check
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      # there was an issue with the rollup binary not being available in the runner https://github.com/npm/cli/issues/4828
      - name: Install Rollup
        run: npm install @rollup/rollup-linux-x64-gnu

      - name: Install Node.js dependencies
        run: npm ci

      - name: Build Packages
        run: |
          npx nx run-many --all --target=build

      - name: Run Type Check
        run: npx nx run-many --all --target=tsc

      - name: Run Type Check For Apps
        run: npx nx run-many --all --target=tsc:${{ github.event.pull_request.base.ref }}
