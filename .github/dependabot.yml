version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
    groups:
      # Security updates stay grouped for fast remediation
      security:
        applies-to: security-updates
        patterns: ["*"]
      # Minor updates grouped by ecosystem
      react-and-ui:
        applies-to: version-updates
        update-types: ["minor"]
        patterns:
          - "react*"
          - "@types/react*"
          - "@chakra-ui/*"
          - "@emotion/*"
      testing:
        applies-to: version-updates
        update-types: ["minor"]
        patterns:
          - "@testing-library/*"
          - "@solidjs/testing-library"
          - "jest*"
          - "@types/jest"
          - "vitest*"
          - "@playwright/*"
          - "playwright*"
      linting:
        applies-to: version-updates
        update-types: ["minor"]
        patterns:
          - "eslint*"
          - "prettier*"
          - "@typescript-eslint/*"
      build-and-tooling:
        applies-to: version-updates
        update-types: ["minor"]
        patterns:
          - "typescript"
          - "vite*"
          - "webpack*"
          - "nx"
          - "@nx/*"
          - "env-cmd"
          - "husky"
          - "lint-staged"
      # Major updates get individual PRs (not grouped)

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 2