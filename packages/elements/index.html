<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photon Components</title>
    <script src="./src/index.ts" type="module"></script>

    <script>
      window.addEventListener('photon-user-token', (e) => {
        console.log('photon-user-token:', e.detail.token);
      });

      window.addEventListener('photon-order-created', (e) => {
        console.log(e);
        const parent = document.getElementById('parent');
        const one = document.getElementById('one');
        one.remove();

        const two = document.createElement('photon-prescribe-workflow');
        two.id = 'two';
        two.patientId = 'pat_01JGQ28XABSJGGJ7DRGZDB95X4';
        two.pharmacyId = 'phr_01GA9HPXAF9BC9PC8XM25Q836N';
        two.templateIds = 'tmp_01HF7H3J7J37458TEMT6R8JW84';
        two.enableOrder = true;
        two.hideTemplates = true;
        setTimeout(() => {
          parent.appendChild(two);
        }, 1000);
      });

      window.addEventListener('photon-supervisor-error', (e) => {
        console.log(e.detail);
      });
    </script>
  </head>
  <body style="margin: 0px">
    <photon-client
      id="7N9QZujlNJHL8EIPqXpu1wq8OuXqoxKb"
      org="org_KzSVZBQixLRkqj5d"
      domain="auth.boson.health"
      env="boson"
      audience="https://api.boson.health"
      uri="https://api.boson.health/graphql"
      auto-login="true"
      emit-user-token="true"
    >
      <div style="padding: 15px" id="parent">
        <photon-prescribe-workflow
          optional-patient-address="true"
          address='{"street1": "123 Main St", "city": "Calistoga", "state": "CA", "postalCode": "94515"}'
          enable-order="true"
          enable-med-history="true"
          enable-med-history-refill-button="true"
          enable-combine-and-duplicate="true"
          enable-coverage-check="true"
          enable-send-to-patient="true"
          enable-local-pickup="true"
          disable-list='[{"treatmentIds": ["med_01J6ZE5RSPDRXZRX7SEFHJSMDB"], "reason": "Not covered by patient insurance"}, {"treatmentIds": ["med_01J6ZE5RTEB5FK0CES2DDQWYV2"], "reason": "Too expensive"}]'
          id="one"
          supervisor='{"firstName": "Testembed"}'
        ></photon-prescribe-workflow>
      </div>
    </photon-client>
  </body>
</html>
